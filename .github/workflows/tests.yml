name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[neural,dev]'
      - name: Neural model tests
        working-directory: Aegis
        run: python -m unittest discover -s tests -v
      - name: Review experiment tests
        working-directory: Agent
        run: python -m unittest discover -s tests -v
      - name: API and CLI tests
        run: python -m pytest tests -v
      - name: Offline example
        run: python Agent/run_review_experiment.py --config Agent/examples/review_archive.json --output outputs/review --simulate
