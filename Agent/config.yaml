deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  timeout: 45
models:
  first_layer: deepseek-chat
  second_layer: deepseek-chat
data:
  input_file: examples/review_synthetic.csv
detection:
  fake_threshold: 0.7
  real_threshold: 0.3
  second_layer_trigger_fake_cap: 0.9
  output_csv: ../outputs/detections.csv
logging:
  level: INFO
first_layer:
  weights:
    情绪煽动: 0.30
    夸张程度: 0.25
    偏见倾向: 0.30
    常识冲突: 0.15
  self_consistency_n: 1
second_layer:
  aspect_weights:
    情绪煽动: 0.30
    夸张程度: 0.25
    偏见倾向: 0.30
    常识冲突: 0.15
  temperature_true: 0.25
  temperature_fake: 1.3
  max_tokens: 800
